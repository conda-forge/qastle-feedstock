{% set name = "qastle" %}
{% set version = "0.20.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/qastle-{{ version }}.tar.gz
  sha256: e532ec9df5ec3f7f445dff5369dca162cac8bf813733108daa0a511c1c8b5841

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }},<3.16
    - lark

test:
  imports:
    - qastle
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/iris-hep/qastle
  summary: Query AST Language Expressions
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/iris-hep/qastle

extra:
  recipe-maintainers:
    - masonproffitt
    - matthewfeickert
